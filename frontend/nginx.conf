server {
    listen 80;
    listen [::]:80;
    server_name api.jeffersonimmobilier.bf;

    # Redirection propre et permanente vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.jeffersonimmobilier.bf;

    # Certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/api.jeffersonimmobilier.bf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jeffersonimmobilier.bf/privkey.pem;

    # Optimisation de la sécurité SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 🚀 Crucial pour Cloudinary : Autorise l'envoi d'images jusqu'à 10 Mo
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # Transmission des en-têtes d'origine au Backend Spring Boot
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Paramètres de timeout pour éviter les coupures sur les requêtes longues
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
}
