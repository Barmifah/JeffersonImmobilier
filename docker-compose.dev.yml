services:
  backend:
    image: eclipse-temurin:17-jdk
    container_name: jefferson-backend-dev
    working_dir: /workspace
    # Utilisation de sh -c pour éviter les conflits de format Windows/Linux sur le script mvnw
    command: ["sh", "-c", "chmod +x mvnw && ./mvnw -q -DskipTests compile && (./mvnw spring-boot:run & app_pid=$$!; trap 'kill $$app_pid 2>/dev/null || true' TERM INT; while kill -0 $$app_pid 2>/dev/null; do ./mvnw -q -DskipTests compile || true; sleep 2; done; wait $$app_pid)"]
    volumes:
      - ./backend:/workspace
      - backend_maven_cache:/root/.m2
      - backend_target:/workspace/target
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jefferson_immobilier?user=jefferson&password=jefferson_dev
      DATABASE_USERNAME: jefferson
      DATABASE_PASSWORD: jefferson_dev
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: http://localhost:5173
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SERVER_PORT: 8080
      
      # 🔐 CONFIGURATION SÉCURITÉ OBLIGATOIRE POUR LE DEV
      JWT_SECRET: SuperSecureJWTKeyForDevelopment2026Minimum32CharsLong
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000

      # ☁️ CONFIGURATION CLOUDINARY POUR LE DEV
      # En local, vous pouvez réutiliser vos vrais identifiants Cloudinary pour tester l'upload d'images
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: jefferson-frontend-dev
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Indique à votre Axios local où trouver le backend dockerisé
      VITE_API_URL: http://localhost:8080/api
      # Fiabilise la détection des changements avec les volumes Docker Desktop sous Windows
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: jefferson-postgres-dev
    environment:
      POSTGRES_DB: jefferson_immobilier
      POSTGRES_USER: jefferson
      POSTGRES_PASSWORD: jefferson_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jefferson -d jefferson_immobilier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_maven_cache:
  backend_target:
  frontend_node_modules:
 