services:
  backend:
    image: eclipse-temurin:17-jdk
    container_name: jefferson-backend-dev
    working_dir: /workspace
    command: ["sh", "mvnw", "spring-boot:run"]
    volumes:
      - ./backend:/workspace
      - backend_maven_cache:/root/.m2
      - backend_target:/workspace/target
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jefferson_immobilier
      DATABASE_USERNAME: jefferson
      DATABASE_PASSWORD: jefferson_dev
      FRONTEND_URL: http://localhost:5173
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: jefferson-frontend-dev
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: jefferson-postgres-dev
    environment:
      POSTGRES_DB: jefferson_immobilier
      POSTGRES_USER: jefferson
      POSTGRES_PASSWORD: jefferson_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jefferson -d jefferson_immobilier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_maven_cache:
  backend_target:
  frontend_node_modules: