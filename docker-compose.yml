services:
  backend:
    build: ./backend
    container_name: jefferson-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jefferson_immobilier
      DATABASE_USERNAME: jefferson
      DATABASE_PASSWORD: jefferson_dev
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: jefferson-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: jefferson-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jefferson_immobilier
      POSTGRES_USER: jefferson
      POSTGRES_PASSWORD: jefferson_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jefferson -d jefferson_immobilier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: