services:
  postgres:
    image: postgres:16-alpine
    container_name: jefferson-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jefferson_immobilier
      POSTGRES_USER: jefferson
      POSTGRES_PASSWORD: jefferson_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jefferson -d jefferson_immobilier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: